<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYH的资料库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .modal-mask { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
        /* 自定义滚动条样式 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col">
        
        <header class="bg-white shadow-sm pt-10 pb-6 px-4 sticky top-0 z-30">
            <div class="max-w-5xl mx-auto">
                <div class="flex items-center justify-center gap-3 text-slate-800 mb-6">
                    <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white text-xl shadow-lg">
                        <i class="fa-solid fa-database"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">TYH的资料库</h1>
                </div>
                
                <div class="relative max-w-xl mx-auto mb-6">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input 
                        v-model="search" 
                        type="text" 
                        class="block w-full pl-11 pr-4 py-3 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-inner" 
                        placeholder="搜索资源名称...">
                </div>

                <div class="flex justify-center gap-2 overflow-x-auto hide-scrollbar pb-2">
                    <button 
                        v-for="cat in categories" 
                        @click="activeCat = cat"
                        :class="activeCat === cat 
                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30' 
                            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
                        class="px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-200">
                        {{ cat }}
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
            
            <div v-if="filteredList.length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div v-for="item in filteredList" :key="item.id" 
                    class="card-hover bg-white p-5 rounded-xl border border-slate-100 flex flex-col justify-between h-full group">
                    
                    <div class="flex gap-4 mb-4">
                        <div class="w-12 h-12 rounded-lg flex-shrink-0 flex items-center justify-center text-xl"
                             :class="getIconStyle(item.category).bg">
                            <i :class="getIconStyle(item.category).icon"></i>
                        </div>
                        
                        <div class="overflow-hidden">
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-bold text-slate-800 text-lg truncate">{{ item.title }}</h3>
                                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-100 text-slate-500 border border-slate-200 whitespace-nowrap">
                                    {{ item.category }}
                                </span>
                            </div>
                            <p class="text-slate-500 text-sm line-clamp-2 leading-relaxed">{{ item.desc }}</p>
                        </div>
                    </div>

                    <button @click="openModal(item)" 
                       class="mt-auto w-full bg-slate-50 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 border border-slate-200 hover:border-indigo-200 py-2.5 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2">
                       <i class="fa-solid fa-cloud-arrow-down"></i> 点击下载
                    </button>
                </div>
            </div>

            <div v-else class="text-center py-20">
                <div class="inline-block p-4 rounded-full bg-slate-100 mb-3">
                    <i class="fa-solid fa-inbox text-slate-300 text-3xl"></i>
                </div>
                <p class="text-slate-500 text-sm">该分类下暂时没有相关资源</p>
            </div>

        </main>
        
        <footer class="text-center py-8 text-slate-400 text-xs">
            <p>© 2024 TYH的资料库</p>
        </footer>

        <div v-if="showModal" class="modal-mask fixed inset-0 z-50 flex items-center justify-center p-4 transition-opacity">
            <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 relative animate-bounce-in">
                <button @click="closeModal" class="absolute top-4 right-4 text-slate-300 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>

                <div class="text-center">
                    <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                        <i class="fa-solid fa-gift"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-1">即将前往下载</h3>
                    <p class="text-slate-500 text-xs mb-5 px-4">
                        TYH为你整理了这份资源。<br>如果觉得好用，欢迎<span class="text-indigo-600 font-bold">扫码打赏</span>支持更新！
                    </p>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-5 w-48 mx-auto">
                        <img src="qr.jpg" alt="微信打赏" class="w-full h-full object-cover rounded-lg mix-blend-multiply">
                        <p class="text-[10px] text-slate-400 mt-2">微信扫一扫</p>
                    </div>
                    <div class="space-y-2">
                        <a :href="targetLink" target="_blank" @click="closeModal"
                            class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-500/20">
                            已打赏 / 直接下载 <i class="fa-solid fa-arrow-right ml-1"></i>
                        </a>
                        <button @click="closeModal" class="text-slate-400 text-xs hover:text-slate-600 py-1">下次一定</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;
        createApp({
            setup() {
                // --- 核心数据区域 ---
                const resources = ref([
                    // 1. 之前的所有文件 -> 归类为 '学习资料'
                    { id: 1, title: "有机化学", category: "学习资料", desc: "复习资料、课件与题库整理", link: "https://www.123865.com/s/dX5svd-IuTgd" },
                    { id: 2, title: "大学物理（农牧）", category: "学习资料", desc: "农牧类专业基础物理课程资料", link: "https://www.123865.com/s/dX5svd-MuTgd" },
                    { id: 3, title: "分析化学", category: "学习资料", desc: "重点难点解析及相关资源", link: "https://www.123865.com/s/dX5svd-wuTgd" },
                    { id: 4, title: "基础生物化学", category: "学习资料", desc: "核心知识点总结与考研参考", link: "https://www.123865.com/s/dX5svd-guTgd" },
                    { id: 5, title: "思修23版", category: "学习资料", desc: "思想道德与法治2023教材辅助", link: "https://www.123865.com/s/dX5svd-FuTgd" },
                    { id: 6, title: "中国近现代史纲要", category: "学习资料", desc: "史纲重点梳理，期末必备", link: "https://www.123865.com/s/dX5svd-YuTgd" },
                    { id: 7, title: "Python编程", category: "学习资料", desc: "语言入门教程及工具包", link: "https://www.123865.com/s/dX5svd-GuTgd" },
                    { id: 8, title: "植物学", category: "学习资料", desc: "形态解剖、分类及生理资料", link: "https://www.123865.com/s/dX5svd-PuTgd" },
                    { id: 9, title: "微生物学", category: "学习资料", desc: "形态结构、生理代谢及遗传变异", link: "https://www.123865.com/s/dX5svd-XuTgd" },

                    // 2. 预留一些 '破解软件' 和 '有趣软件' 的样本 (你可以直接修改或删除)
                    { id: 10, title: "Photoshop 2024 破解版", category: "破解软件", desc: "免安装绿色版，解压即用，包含最新AI填充功能", link: "#" },
                    { id: 11, title: "Typora 免费版", category: "破解软件", desc: "最后的一款免费版本，好用的Markdown编辑器", link: "#" },
                    { id: 12, title: "桌面电子宠物", category: "有趣软件", desc: "在你的任务栏上养一只可爱的小猫咪", link: "#" },
                ]);

                // 定义你的分类标签
                const categories = ["全部", "学习资料", "破解软件", "有趣软件"];
                
                const search = ref("");
                const activeCat = ref("全部");
                const showModal = ref(false);
                const targetLink = ref("");

                // 核心筛选逻辑：分类 + 搜索 同时生效
                const filteredList = computed(() => {
                    return resources.value.filter(r => {
                        // 1. 先看分类对不对 (如果是全部，就都对)
                        const matchCat = activeCat.value === "全部" || r.category === activeCat.value;
                        // 2. 再看搜的词对不对
                        const key = search.value.toLowerCase().trim();
                        const matchSearch = r.title.toLowerCase().includes(key) || 
                                          r.desc.toLowerCase().includes(key);
                        
                        return matchCat && matchSearch;
                    });
                });

                // UI美化：不同分类显示不同图标
                const getIconStyle = (cat) => {
                    if (cat === '学习资料') return { icon: 'fa-solid fa-book-open', bg: 'bg-emerald-100 text-emerald-600' };
                    if (cat === '破解软件') return { icon: 'fa-brands fa-windows', bg: 'bg-blue-100 text-blue-600' };
                    if (cat === '有趣软件') return { icon: 'fa-solid fa-ghost', bg: 'bg-purple-100 text-purple-600' };
                    return { icon: 'fa-solid fa-file', bg: 'bg-slate-100 text-slate-600' };
                };

                const openModal = (item) => { targetLink.value = item.link; showModal.value = true; };
                const closeModal = () => showModal.value = false;

                return { resources, categories, search, activeCat, filteredList, showModal, targetLink, openModal, closeModal, getIconStyle };
            }
        }).mount('#app');
    </script>
</body>
</html>
